name: Publish Image

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v1
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        name: Build and push
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/named-query:latest
          build-contexts: endpoint-definition-folder=./ExampleEndpointDefinitions
          cache-from: type=gha
          cache-to: type=gha,mode=max
