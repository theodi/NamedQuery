name: Publish First Test Image

on:
  push:
    branches:
      - main
    paths:
      - FirstTest/**
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v5
      
      - uses: docker/login-action@v1
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        name: Build and push
        with:
          context: ./FirstTest
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/named-query-first-test:latest
          build-contexts: endpoint-definition-folder=./FirstTest/exampleResources
