name: Test First Test Image

on:
  pull_request:
    paths:
      - FirstTest/**

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Test
        working-directory: FirstTest
        run: dotnet test --solution FirstTest.slnx
